[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conrag"]

[project]
name = "ConRAG"
version = "1.0.0"
authors = [{ name = "Yikai Zhu", email = "yikai_zhu@outlook.com" }]
keywords = ["rag", "multi-hop-qa", "knowledge-graph"]
dependencies = [
  "networkx",
  "sentence-transformers",
  "numpy",
  "faiss-cpu",
  "openai",
  "json-repair",
  "python-dotenv",
  "tqdm",
  "simple-parsing",
]
requires-python = ">=3.14"
import-names = ["conrag"]
description = "ConRAG: Consensus-Driven Evidence Flow for Multi-Hop Question Answering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/yikai-zhu/ConRAG"
Issues = "https://github.com/yikai-zhu/ConRAG/issues"
Paper = "https://arxiv.org/abs/2605.28093"

[project.scripts]
conrag = "conrag.cli:main"

[dependency-groups]
dev = [
  "build",
  "pyright",
  "ruff",
]

[tool.black]
line-length = 1024
target-version = ["py314"]
